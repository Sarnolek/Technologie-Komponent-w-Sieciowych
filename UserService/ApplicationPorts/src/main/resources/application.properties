#spring.application.name=rest-sfs
#spring.data.mongodb.uri=mongodb://admin:adminpassword@localhost:27017,localhost:27018,localhost:27019/sportsfacility?replicaSet=sportsfacility_set_single&authSource=admin

server.port=8081
spring.data.mongodb.uri=mongodb://admin:adminpassword@localhost:27017/users_db?authSource=admin
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:adminpassword}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:public.pem
jwt.private.key.path=secrets/private.pem
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=1.5